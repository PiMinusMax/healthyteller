[application]
name = "healthyteller"

[web.app]
title = "Healthy Teller"

[bundle]
identifier = "io.github.piminusmax.healthyteller"
publisher = "Healthy Teller"
icon = ["icons/icon-32.png", "icons/icon-128.png", "icons/icon-256.png", "icons/icon-512.png", "icons/icon.ico"]
short_description = "Prüft Lebensmittel gegen mehrere Erkrankungen und Allergien zugleich."
copyright = "GPL-3.0-or-later"

[bundle.windows]
# Download WebView2 only if missing instead of shipping the offline installer (~150 MB).
webview_install_mode = { DownloadBootstrapper = { silent = true } }
