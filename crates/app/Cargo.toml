[package]
name = "healthyteller-app"
description = "Healthy Teller app for web, desktop, Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
fluent-bundle = "0.16.0"
healthyteller-core = { workspace = true }
healthyteller-ingest = { workspace = true }
healthyteller-storage = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
unic-langid = { version = "0.9.6", features = ["macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
healthyteller-barcode = { path = "../barcode" }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6.0.0"

[dev-dependencies]
fluent-syntax = "0.12.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
