[package]
name = "healthyteller-barcode"
description = "Barcode recognition for Healthy Teller, also as WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "no_character_set_support"] }

# rxing reads the clock for each result; in the browser that needs chrono's JS binding.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "no_character_set_support", "wasm_support"] }

[dev-dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "encoders", "no_character_set_support"] }

[lints]
workspace = true
