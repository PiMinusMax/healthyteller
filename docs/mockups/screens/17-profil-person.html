<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Profil anlegen, Schritt 1</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
body{margin:0}
a{color:#1D3B8F}a:hover{color:#132A66}
:focus-visible{outline:3px solid #1D3B8F;outline-offset:2px}
</style>
</head>
<body>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3ED; color: #15181C; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="01-grundhinweis.html" aria-label="Zurück zum Grundhinweis" style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; background: #FFFFFF; border: 1px solid #D8D4CA; color: #15181C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <p style="flex: 1; margin: 0; font-size: 17px; font-weight: 700; color: #474C54">Neues Profil</p>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 24px 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div role="img" aria-label="Schritt 1 von 4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <span style="height: 8px; border-radius: 4px; background: #1D3B8F"></span>
        <span style="height: 8px; border-radius: 4px; background: #D8D4CA"></span>
        <span style="height: 8px; border-radius: 4px; background: #D8D4CA"></span>
        <span style="height: 8px; border-radius: 4px; background: #D8D4CA"></span>
      </div>
      <p style="margin: 0; font-size: 15px; color: #474C54">Schritt 1 von 4 · Person</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">Für wen ist das Profil?</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.45; color: #474C54">Alter und Geschlecht bestimmen die Referenzwerte, zum Beispiel wie viel Vitamin D oder Eiweiß pro Tag empfohlen wird.</p>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #D8D4CA; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="name" style="font-size: 17px; font-weight: 700">Name</label>
        <input id="name" type="text" value="Erika Mustermann" style="height: 56px; padding: 0 16px; box-sizing: border-box; border: 2px solid #474C54; border-radius: 12px; background: #FFFFFF; color: #15181C; font: inherit; font-size: 19px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="alter" style="font-size: 17px; font-weight: 700">Alter</label>
        <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; box-sizing: border-box; border: 2px solid #474C54; border-radius: 12px; background: #FFFFFF; width: 160px">
          <input id="alter" type="number" inputmode="numeric" value="68" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #15181C; font: inherit; font-size: 20px">
          <span style="font-size: 17px; font-weight: 700; color: #474C54">Jahre</span>
        </div>
      </div>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0 0 8px 0; font-size: 17px; font-weight: 700">Geschlecht</legend>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; box-sizing: border-box; border: 2px solid #1D3B8F; border-radius: 14px; background: #E3E9F7; font-weight: 700; cursor: pointer"><input type="radio" name="geschlecht" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>weiblich</span></label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; cursor: pointer"><input type="radio" name="geschlecht" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>männlich</span></label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; cursor: pointer"><input type="radio" name="geschlecht" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>keine Angabe</span></label>
      </fieldset>
    </section>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="01-grundhinweis.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; background: #FFFFFF; border: 2px solid #1D3B8F; color: #1D3B8F; font-size: 18px; font-weight: 700; text-decoration: none">Zurück</a>
      <a href="18-profil-erkrankungen-fokus.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; background: #1D3B8F; color: #FFFFFF; font-size: 19px; font-weight: 800; text-decoration: none">Weiter</a>
    </div>
  </div>
</main>
</body>
</html>
