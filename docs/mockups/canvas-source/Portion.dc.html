<main style="width: 390px; height: 850px; box-sizing: border-box; background: #F5F3ED; color: #15181C; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <p style="flex: 1; margin: 0; font-size: 17px; font-weight: 700; color: #474C54">Schritt 2 von 2</p>
    <a href="Profil.dc.html" aria-label="Profil Erika Mustermann, wechseln" style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 22px; background: #FFFFFF; border: 1px solid #D8D4CA; color: #15181C; text-decoration: none; font-size: 16px; font-weight: 700">

      <p style="margin: 0; font-size: 16px; color: #474C54">Generisch · BLS 4.0</p>
    </div>

    <fieldset style="margin: 0; padding: 18px; border: 1px solid #D8D4CA; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0 6px; font-size: 18px; font-weight: 700">Wie viel?</legend>

        <label for="menge" style="font-size: 16px; color: #474C54">Menge in Gramm</label>
        <output for="menge" style="font-size: 32px; font-weight: 800; line-height: 1">150 g</output>
      </div>
      <input id="menge" type="range" min="25" max="500" step="5" value="150" style="width: 100%; height: 44px; margin: 0; accent-color: #1D3B8F">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border: 1px solid #B9B4A8; border-radius: 12px; background: #FFFFFF; color: #15181C; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">100 g</button>
        <button type="button" aria-pressed="true" style="height: 48px; border: 2px solid #1D3B8F; border-radius: 12px; background: #E3E9F7; color: #1D3B8F; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">150 g</button>

      <legend style="padding: 0 6px; font-size: 18px; font-weight: 700">Wie zubereitet?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; font-size: 18px; cursor: pointer"><input type="radio" name="zubereitung" value="roh" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>roh</span></label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; font-size: 18px; cursor: pointer"><input type="radio" name="zubereitung" value="gekocht" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>gekocht</span></label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; font-size: 18px; cursor: pointer"><input type="radio" name="zubereitung" value="gedünstet" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>gedünstet</span></label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; font-size: 18px; cursor: pointer"><input type="radio" name="zubereitung" value="gebraten" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>gebraten</span></label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 2px solid #1D3B8F; border-radius: 14px; background: #E3E9F7; font-size: 18px; font-weight: 700; cursor: pointer"><input type="radio" name="zubereitung" value="gegrillt" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>gegrillt</span></label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; box-sizing: border-box; border: 1px solid #B9B4A8; border-radius: 14px; font-size: 18px; cursor: pointer"><input type="radio" name="zubereitung" value="geräuchert" style="width: 22px; height: 22px; margin: 0; accent-color: #1D3B8F"><span>geräuchert</span></label>
      </div>
      <label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px 0 2px; border-top: 1px solid #E6E2D8; cursor: pointer">
        <input type="checkbox" style="flex: none; width: 24px; height: 24px; margin: 2px 0 0 0; accent-color: #1D3B8F">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">Paniert oder mariniert</span><span style="font-size: 15px; line-height: 1.4; color: #474C54">Zusätzliche Zutaten werden mitgeprüft, zum Beispiel Ei in der Panade.</span></span>
      </label>
    </fieldset>

    <a href="Karte.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; background: #1D3B8F; color: #FFFFFF; font-size: 20px; font-weight: 800; text-decoration: none">Bewerten</a>
  </div>
