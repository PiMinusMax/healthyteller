# Loads each online source once a week and checks that its format is unchanged.
# Real data is only used inside this run and never published (AGENTS.md rule 1).
name: Source check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/source-check.yml", "crates/ingest/examples/**"]

permissions:
  contents: read

jobs:
  open-food-facts:
    name: Open Food Facts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      UA: "HealthyTeller/0.1 (https://github.com/PiMinusMax/healthyteller) source-check"
      # A long-listed product, chosen because it is unlikely to disappear.
      BARCODE: "3017624010701"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Product API
        id: product
        run: |
          curl -sSf -A "$UA" -o product.json \
            "https://world.openfoodfacts.org/api/v2/product/${BARCODE}.json?fields=code,product_name,product_name_de,brands,nutriments,allergens_tags,traces_tags,ingredients_text,ingredients_text_de,completeness,rev"
          cargo run -q -p healthyteller-ingest --example check_product -- product.json
      - name: Search services
        id: search
        # Name search needs at least one working service; each status is listed.
        run: |
          ok=0
          for url in \
            "https://search.openfoodfacts.net/search?q=quark&page_size=1" \
            "https://search.openfoodfacts.org/search?q=quark&page_size=1" \
            "https://world.openfoodfacts.org/cgi/search.pl?search_terms=quark&search_simple=1&action=process&json=1&page_size=1"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$url" || echo 000)
            echo "$status $url" | tee -a search-status.txt
            [ "$status" = 200 ] && ok=1
          done
          [ "$ok" = 1 ]
      - name: Open an issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Quellen-Check: Open Food Facts hat sich geändert oder ist nicht erreichbar"
          if gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            echo "Issue already open"; exit 0
          fi
          {
            echo "Der wöchentliche Quellen-Check ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Produkt-API: ${{ steps.product.outcome }}, Suche: ${{ steps.search.outcome }}"
            echo
            echo '```'
            cat search-status.txt 2>/dev/null || true
            echo '```'
          } > body.md
          gh issue create --title "$title" --body-file body.md
