# Stops external data from landing in the repository (AGENTS.md rule 1).
name: Repo guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: No external data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check committed files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # New branch or force push: check the whole history of the pushed commit.
            range="$AFTER"
          fi
          scripts/repo-guard.sh "$range"
