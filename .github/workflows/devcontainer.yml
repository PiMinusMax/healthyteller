# Builds the dev container whenever it changes, so a broken setup is noticed
# before someone tries to work in it.
name: Dev Container

on:
  push:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build dev container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            cargo --version && dx --version && cargo deny --version
            node --version && claude --version
            sdkmanager --list_installed
