# Required checks for every push and pull request (AGENTS.md rule 10):
# formatting, lints without warnings, licenses, unit, frontend and accessibility tests.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  CARGO_DENY_VERSION: 0.18.9
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy (web, native)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (web, wasm32)
        run: cargo clippy -p healthyteller-app --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (desktop)
        run: cargo clippy -p healthyteller-app --all-targets --no-default-features --features desktop -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-core-purity.sh

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz" \
            | tar xz -C ~/.cargo/bin --strip-components=1 "${name}/cargo-deny"
      - run: cargo deny check

  web:
    name: Web build, end-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install dx
        run: curl -sSfL "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C ~/.cargo/bin dx
      - name: Build web app
        working-directory: crates/app
        run: dx build --platform web --release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  desktop:
    name: Desktop build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p healthyteller-app --no-default-features --features desktop
      - run: scripts/desktop-smoke.sh target/debug/healthyteller-app
