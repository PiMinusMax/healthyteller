# Builds the Android app and starts it in an emulator on Linux.
# Runs for pull requests to main and before every release.
name: Android

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  APP_ID: io.github.piminusmax.healthyteller

jobs:
  emulator:
    name: Build and start in emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: rustup toolchain install && rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install dx
        run: curl -sSfL "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C ~/.cargo/bin dx
      - name: Build APK
        working-directory: crates/app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          dx build --platform android --target x86_64-linux-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/android-smoke.sh "$APP_ID"
